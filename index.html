<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CECS App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f7fa;
      color: #333;
    }
    header {
      background: #4285F4;
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 15px;
    }
    nav a:hover { text-decoration: underline; }
    .hero {
      text-align: center;
      padding: 80px 20px;
    }
    .hero h2 { font-size: 36px; margin-bottom: 16px; color: #4285F4; }
    .hero p { font-size: 18px; color: #555; max-width: 600px; margin: 0 auto 30px; }
    .btn {
      background: #4285F4;
      color: white;
      padding: 12px 30px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 16px;
    }
    .btn:hover { background: #3367d6; }
    footer {
      text-align: center;
      padding: 20px;
      font-size: 13px;
      color: #999;
      border-top: 1px solid #ddd;
      margin-top: 60px;
    }
    footer a { color: #4285F4; text-decoration: none; }
